{% extends 'base.html' %}
{% block title %}Ask a Doubt — {{ course.title }}{% endblock %}

{% block content %}
<div style="max-width:600px;margin:0 auto;">
    <a href="{% url 'doubt_list' course.id %}" class="btn btn-secondary btn-sm mb-2">← Back to Doubts</a>

    <div class="card">
        <h1 style="font-size:1.3rem;margin-bottom:0.25rem;">Ask a Doubt</h1>
        <p class="text-muted mb-2">{{ course.title }}</p>

        <form method="post" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" name="title" id="title" class="form-control"
                       placeholder="A short summary of your question" required>
            </div>
            <div class="form-group">
                <label for="body">Describe your doubt</label>
                <textarea name="body" id="body" class="form-control" rows="5"
                          placeholder="Give as much detail as you can — it helps your trainer answer faster." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Post Doubt</button>
        </form>
    </div>
</div>
{% endblock %}
