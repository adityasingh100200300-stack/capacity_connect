{% extends 'base.html' %}
{% block title %}Ask a Doubt — {{ course.title }}{% endblock %}

{% block content %}
<div style="max-width: 640px; margin: 0 auto;">
    <div class="d-flex align-center mb-2" style="gap: 0.75rem;">
        <a href="{% url 'doubt_list' course.id %}" class="btn btn-secondary btn-sm">← Back to Q&amp;A Hub</a>
    </div>

    <div class="card" style="box-shadow: 0 4px 20px var(--shadow);">
        <div class="card-header">
            <div>
                <h1 style="font-size: 1.25rem; font-weight: 800; margin: 0;">Submit Student Question</h1>
                <p class="text-muted" style="font-size: 0.82rem; margin-top: 0.2rem;">Course: {{ course.title }}</p>
            </div>
            <span class="badge badge-trainee">Direct Inquiry</span>
        </div>
        <div class="card-body">
            <form method="post" novalidate>
                {% csrf_token %}
                <div class="form-group">
                    <label for="title">Question Summary</label>
                    <input type="text" name="title" id="title" class="form-control"
                           placeholder="e.g., Clarification needed on Module 3 asynchronous functions" required>
                </div>
                <div class="form-group">
                    <label for="body">Detailed Inquiry</label>
                    <textarea name="body" id="body" class="form-control" rows="6"
                              placeholder="Provide the context, code snippet, or slide number you are struggling with..." required></textarea>
                </div>
                <div style="display: flex; gap: 0.75rem; margin-top: 1.75rem; padding-top: 1rem; border-top: 1px solid var(--border);">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Submit Question</button>
                    <a href="{% url 'doubt_list' course.id %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
