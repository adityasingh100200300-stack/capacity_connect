{% extends 'base.html' %}
{% block title %}Login — Capacity Connect{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 4rem auto;">
    <div class="card">
        <div style="text-align:center; margin-bottom: 1.75rem;">
            <h1 style="font-size:1.5rem;">Welcome back</h1>
            <p class="text-muted mt-1">Sign in to Capacity Connect</p>
        </div>

        <form method="post" novalidate>
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" required
                       class="form-control" placeholder="your_username" autofocus>
            </div>

            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" required
                       class="form-control" placeholder="••••••••">
            </div>

            {% if form.non_field_errors %}
                <div class="alert alert-danger">{{ form.non_field_errors|join:", " }}</div>
            {% endif %}

            <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
        </form>

        <p style="text-align:center; margin-top:1.25rem; font-size:0.85rem;" class="text-muted">
            Don't have an account? <a href="{% url 'register' %}" style="color:var(--primary);">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
