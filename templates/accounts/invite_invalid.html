{% extends 'base.html' %}
{% block title %}Invitation Expired or Invalid — Capacity Connect{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 3rem auto;">
    <div class="card empty-state" style="padding: 3.5rem 2rem; box-shadow: 0 4px 20px var(--shadow);">
        <div class="empty-state-icon" style="font-size: 2.5rem;">⚠️</div>
        <h2 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text);">Invitation Token Invalid</h2>
        <p class="text-muted" style="margin-bottom: 1.5rem; font-size: 0.9rem; line-height: 1.6;">
            {{ reason|default:"This invitation link has expired or has already been utilized." }}
        </p>
        <div style="display: flex; gap: 0.75rem; justify-content: center;">
            <a href="{% url 'login' %}" class="btn btn-primary btn-sm">Return to Login</a>
            <a href="{% url 'home' %}" class="btn btn-outline btn-sm">Homepage</a>
        </div>
    </div>
</div>
{% endblock %}
