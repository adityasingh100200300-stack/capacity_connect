{% extends 'base.html' %}
{% block title %}Verify Email — Capacity Connect{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 3.5rem auto;">
    <div class="card card-auth" style="box-shadow: 0 16px 40px var(--shadow-md); border-color: var(--border-dark); position: relative; overflow: hidden; padding: 2.5rem 2.25rem;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(90deg, var(--primary), var(--accent));"></div>

        <div style="text-align: center; margin-bottom: 2rem; padding-top: 0.5rem;">
            <div style="width: 48px; height: 48px; margin: 0 auto 1rem; border-radius: 12px; background: linear-gradient(135deg, var(--info), var(--primary)); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #fff; box-shadow: 0 6px 18px var(--primary-glow);">
                ✉️
            </div>
            <h1 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 0.35rem;">Verify your email</h1>
            <p class="text-muted" style="font-size: 0.875rem;">We sent a 6-digit confirmation code to <strong style="color: var(--text);">{{ email }}</strong></p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group" style="text-align: center;">
                <label for="code" class="form-label" style="margin-bottom: 0.75rem;">Enter 6-digit verification code</label>
                <input type="text" name="code" id="code" class="form-control" maxlength="6" required autofocus
                       style="text-align: center; font-size: 1.5rem; letter-spacing: 0.5rem; font-weight: 700; padding: 0.75rem;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 0.95rem; margin-top: 0.5rem;">
                Verify & Activate Account →
            </button>
        </form>

        <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border); text-align: center;">
            <p style="font-size: 0.85rem; color: var(--text-muted);">
                Didn't receive the code? <a href="{% url 'resend_otp' %}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Resend OTP</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
