{% extends 'base.html' %}
{% block content %}
<div style="max-width: 480px; margin: 3rem auto;">
    <div class="card">
        <h1 style="font-size:1.4rem;">Verify your email</h1>
        <p class="text-muted mt-1">We sent a 6-digit code to {{ email }}.</p>

        <form method="post" class="mt-2">
            {% csrf_token %}
            <div class="form-group">
                <label for="code">Verification Code</label>
                <input type="text" name="code" id="code" class="form-control" maxlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Verify</button>
        </form>
    </div>
    <p class="text-muted mt-2" style="text-align:center; font-size:0.85rem;">
        Didn't get a code? <a href="{% url 'resend_otp' %}" style="color:var(--primary);">Resend</a>
    </p>
</div>
{% endblock %}
