<!DOCTYPE html> <!-- Declares this document as an HTML5 file for the browser -->
<html lang="en"> <!-- Starts the HTML structure and sets the language to English -->
<head> <!-- Opens the metadata section -->
    <meta charset="UTF-8"> <!-- Ensures proper character rendering -->
    <title>Assessment Result</title> <!-- Sets the browser tab title -->
</head> <!-- Closes the metadata section -->
<body> <!-- Opens the visible content area -->
    <h1>Assessment Complete</h1> <!-- Displays a static heading indicating the exam is over -->
    <p>Your score: {{ attempt.score_percent }}%</p> <!-- Renders the final calculated percentage from the attempt model -->
    <a href="/">Return to Dashboard</a> <!-- Provides a basic hyperlink to navigate back to the main application -->
</body> <!-- Closes the body section -->
</html> <!-- Closes the HTML document -->
