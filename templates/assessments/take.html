<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Take Assessment</title>
</head>
<body>
    <h1>{{ attempt.assessment.title }}</h1>
    <p>Time allowed: {{ allowed_seconds }} seconds</p>

    <form method="POST">
        {% csrf_token %}

        {% for question in attempt.assessment.questions.all %}
            <div>
                <h3>{{ question.question_text }}</h3>

                {% for option in question.options %}
                    <label>
                        <input type="radio" name="question_{{ question.id }}" value="{{ forloop.counter0 }}">
                        {{ option }}
                    </label><br>
                {% endfor %}

            </div>
            <hr>
        {% endfor %}

        <button type="submit">Submit Assessment</button>
    </form>
</body>
</html>
